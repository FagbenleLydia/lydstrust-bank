server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers — applied to all responses served by this server block
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header X-XSS-Protection "0" always;

    # Gzip — reduces JS/CSS bundle sizes by ~65% over the wire
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        image/svg+xml;

    # Proxy API calls to the backend container (internal Docker network only)
    location /api/ {
        proxy_pass http://backend:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React SPA — serve index.html for all client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
