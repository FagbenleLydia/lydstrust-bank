services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - app

  backend:
    build: ./backend
    restart: unless-stopped
    expose:
      - "5001"
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/lydstrust-bank
    depends_on:
      - mongodb
    networks:
      - app

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app

volumes:
  mongo_data:

networks:
  app:
